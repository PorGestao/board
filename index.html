<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Guia do Morador</title>
<link rel="stylesheet" href="assets/cartilha.css">
<style>
  body { min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
  .caixa-raiz { max-width: 440px; }
  .caixa-raiz h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(32px, 8vw, 44px); line-height: 1.1; margin: 0 0 12px; font-variation-settings: "opsz" 72; }
  .caixa-raiz p { color: var(--suave); margin: 0; }
  .caixa-raiz .rotulo { color: var(--cor); opacity: 1; }
</style>
</head>
<body>
  <main class="caixa-raiz">
    <p class="rotulo">Guia do morador</p>
    <h1>Use o QR code do seu prédio</h1>
    <p>Cada prédio tem o próprio guia. O QR code e a senha estão com o síndico e nas áreas comuns do seu condomínio.</p>
  </main>
</body>
</html>
